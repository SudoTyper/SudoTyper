<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="50" cy="50" r="40"/>
    </clipPath>
  </defs>

  <!-- Circle outline -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#707070" stroke-width="5"/>

  <!-- Two lines clipped inside the circle -->
  <line x1="10" y1="36" x2="90" y2="36" stroke="#707070" stroke-width="5" clip-path="url(#circle-clip)"/>
  <line x1="10" y1="64" x2="90" y2="64" stroke="#707070" stroke-width="5" clip-path="url(#circle-clip)"/>
</svg>
